
name: AI Agent CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        env:
          GEMINI_API_KEY: dummy-key-for-ci
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/sarach846/aiagent-ci-cd:latest .

      - name: Push Docker image
        run: docker push ghcr.io/sarach846/aiagent-ci-cd:latest

        
  deploy:
    needs: test
    runs-on: [self-hosted, aiagent-deploy]

    steps:
      - name: Check Docker on Windows
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: docker info

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest Docker image
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: docker pull ghcr.io/sarach846/aiagent-ci-cd:latest

      
      - name: Deploy AI Agent on Windows
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $envFile = "C:\Users\User\Downloads\AIAgent-Docker\.env"

          if (-not (Test-Path $envFile)) {
            throw "Local .env file not found"
          }

          $existing = docker ps -aq --filter "name=^/aiagent-app$"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if ($existing) {
            docker rm -f aiagent-app
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          docker run -d --platform linux/amd64 --name aiagent-app `
            -p 127.0.0.1:8000:8000 `
            --env-file $envFile `
            ghcr.io/sarach846/aiagent-ci-cd:latest

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          docker exec aiagent-app python manage.py migrate
          exit $LASTEXITCODE
  